  <text x="814" y="393" fill="#DFE8F3" font-family="Arial,sans-serif" font-size="9" font-weight="700">Journal</text>
  <text x="790" y="422" fill="#8797AA" font-family="Arial,sans-serif" font-size="8">Write and reflect</text>
  <rect x="969" y="365" width="181" height="78" rx="7" fill="#172436" stroke="#30445A"/>
  <circle cx="995" cy="390" r="10" fill="#25374A"/>
