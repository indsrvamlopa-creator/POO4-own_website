  <path d="M70 300c2-6 11-6 14 0M73 294a4 4 0 1 0 8 0" stroke="#A5D7CD" stroke-width="1.4" stroke-linecap="round"/>
  <rect x="105" y="276" width="403" height="66" rx="8" fill="#172537" stroke="#2C4055"/>
  <text x="123" y="299" fill="#DCE6F1" font-family="Arial,sans-serif" font-size="10">Welcome. Take a breath, and share whatever</text>
  <text x="123" y="318" fill="#DCE6F1" font-family="Arial,sans-serif" font-size="10">feels comfortable. We can take it one step at a time.</text>
  <text x="473" y="332" fill="#798AA0" font-family="Arial,sans-serif" font-size="7">A MOMENT AGO</text>
  <rect x="285" y="359" width="396" height="53" rx="8" fill="#203041" stroke="#35485D"/>
  <text x="304" y="382" fill="#DCE5EF" font-family="Arial,sans-serif" font-size="10">I have a lot on my mind and don't know where to start.</text>
  <text x="304" y="400" fill="#8596AA" font-family="Arial,sans-serif" font-size="7">JUST NOW</text>
  <circle cx="77" cy="463" r="16" fill="#1C3040" stroke="#385466"/>
  <path d="M70 464c2-6 11-6 14 0M73 458a4 4 0 1 0 8 0" stroke="#A5D7CD" stroke-width="1.4" stroke-linecap="round"/>
  <rect x="105" y="435" width="468" height="67" rx="8" fill="#172537" stroke="#2C4055"/>
  <text x="123" y="458" fill="#DCE6F1" font-family="Arial,sans-serif" font-size="10">That sounds like a lot to carry. Would it help to</text>
  <text x="123" y="477" fill="#DCE6F1" font-family="Arial,sans-serif" font-size="10">pause together, or pick one thing to talk through?</text>
  <rect x="49" y="520" width="650" height="27" rx="13.5" fill="#182638" stroke="#34465C"/>
  <text x="66" y="538" fill="#8999AD" font-family="Arial,sans-serif" font-size="8">Write what feels comfortable...</text>
  <circle cx="678" cy="533.5" r="9" fill="url(#calm)"/>
  <path d="m675 534 2 2 4-5" stroke="#132131" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>

