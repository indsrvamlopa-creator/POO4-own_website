  <text x="770" y="224" fill="#EDF3FA" font-family="Arial,sans-serif" font-size="12" font-weight="700">Your wellbeing space</text>
  <text x="770" y="244" fill="#8393A8" font-family="Arial,sans-serif" font-size="8" letter-spacing="1">SMALL PRACTICES, WHEN THEY HELP</text>
  <rect x="770" y="264" width="380" height="89" rx="7" fill="#172436" stroke="#30445A"/>
