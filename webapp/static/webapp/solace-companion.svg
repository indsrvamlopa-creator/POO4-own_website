  <text x="989" y="422" fill="#8797AA" font-family="Arial,sans-serif" font-size="8">Take a mindful pause</text>
  <rect x="770" y="455" width="380" height="82" rx="7" fill="#172436" stroke="#30445A"/>
  <circle cx="795" cy="481" r="10" fill="#25374A"/>
