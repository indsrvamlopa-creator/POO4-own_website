  <text x="790" y="313" fill="#E6EEF8" font-family="Arial,sans-serif" font-size="11" font-weight="700">Notice how today feels</text>
  <text x="790" y="334" fill="#8596AB" font-family="Arial,sans-serif" font-size="8">Your private reflection, over time.</text>
  <circle cx="1116" cy="308" r="17" fill="#213847" stroke="#52736F"/>
