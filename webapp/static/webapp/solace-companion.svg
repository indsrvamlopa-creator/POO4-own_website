  <text x="859" y="130" fill="#A6B2C2" font-family="Arial,sans-serif" font-size="9">YOUR SPACE, AT YOUR PACE</text>
  <rect x="1025" y="112" width="125" height="35" rx="17.5" fill="#1A2B3D" stroke="#3B526A"/>
